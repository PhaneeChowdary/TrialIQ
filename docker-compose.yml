# docker compose up --build    then open http://localhost:8020
# The first start pulls qwen3:8b into the ollama volume. About 5 GB.
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull ${TRIALIQ_LOCAL_MODEL:-qwen3:8b} && wait"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30
  app:
    build: .
    ports: ["8020:8020"]
    env_file: [{path: backend/.env, required: false}]
    environment:
      TRIALIQ_OLLAMA_URL: http://ollama:11434
    volumes: [data:/data]
    depends_on:
      ollama: {condition: service_started}
volumes:
  ollama:
  data:
